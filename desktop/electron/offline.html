<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Yukii</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1120;
        color: #e2e8f0;
        font-family: -apple-system, sans-serif;
      }
      main {
        max-width: 560px;
        padding: 32px;
      }
      h1 {
        font-size: 20px;
      }
      p {
        color: #94a3b8;
        line-height: 1.7;
      }
      code {
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Yukii 工作台未启动</h1>
      <p>
        主窗口无法连接 <code>YUKII_WEB_URL</code>。请先在仓库根启动 API/工作台，或设置正确的
        <code>YUKII_WEB_URL</code>。
      </p>
      <p>
        本地受信 CUA 侧栏仍可通过菜单 Computer Use
        使用；如果权限/窗口操作失败，会在控制台显示具体错误。
      </p>
    </main>
  </body>
</html>
